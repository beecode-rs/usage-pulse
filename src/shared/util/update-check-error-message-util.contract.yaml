# Contract for updateCheckErrorMessageUtil, the human-readable rendering of the
# typed UpdateCheckError carried on UpdateStatus. Each error kind resolves to
# exactly one user-facing sentence; HTTP_ERROR 404 is special-cased as the
# "no release published yet" message. The rate-limit term with a reset epoch is
# intentionally not covered here: it embeds a local-time string, so its wording
# is time- and locale-dependent; only the reset-less variant is asserted.
subject: updateCheckErrorMessageUtil
module: ./update-check-error-message-util.js
subjectType: function
methods:
  resolveMessage:
    terms:
      # --- HTTP_ERROR: 404 is the no-release message, others keep the code ---
      - params:
          - error:
              httpStatusCode: 404
              kind: HTTP_ERROR
        result: 'No GitHub release published yet for this project'
      - params:
          - error:
              httpStatusCode: 500
              kind: HTTP_ERROR
        result: 'Update check failed (HTTP 500)'
      - params:
          - error:
              kind: HTTP_ERROR
        result: 'Update check failed'
      # --- The remaining kinds each have one fixed sentence ---
      - params:
          - error:
              kind: INVALID_RESPONSE
        result: 'Received an invalid response from GitHub'
      - params:
          - error:
              kind: NETWORK
        result: 'Network error — check your connection'
      - params:
          - error:
              kind: RATE_LIMITED
        result: 'GitHub API rate limit exceeded'
      - params:
          - error:
              kind: TIMEOUT
        result: 'Request timed out'
      - params:
          - error:
              kind: UNKNOWN
        result: 'Update check failed'
