# Contract for the ps-output helpers of SessionsProcessService: the ppid/comm line
# parser feeding the ancestor walks, the .app bundle extraction from a macOS ps
# comm column, and the lsof pid-line parser feeding the cwd-to-pid resolution.
subject: SessionsProcessService
module: ./process-service.js
subjectType: class
constructor:
  terms:
    # A fresh instance holds no state.
    - params: []
      result:
        {}
methods:
  parseLsofPidLine:
    terms:
      # lsof -F p prints one pid per line prefixed with p.
      - constructorParams: []
        params:
          - line: p501
        result: 501
      # Non-pid field lines do not match.
      - constructorParams: []
        params:
          - line: fcwd
        result: !undefined
      # Bare numbers without the p prefix do not match.
      - constructorParams: []
        params:
          - line: '501'
        result: !undefined
  parseLsofPidLines:
    terms:
      # A full lsof run parses into the pid list, dropping non-pid lines.
      - constructorParams: []
        params:
          - stdout: "p501\np502\nfcwd\n"
        result:
          - 501
          - 502
      # Empty lsof output yields no pids.
      - constructorParams: []
        params:
          - stdout: ""
        result: []
  _parseProcessLine:
    terms:
      # ps ppid/comm output for a live process parses into an entry.
      - constructorParams: []
        params:
          - line: "  777 /usr/bin/usage-pulse-stub"
        result:
          comm: /usr/bin/usage-pulse-stub
          ppid: 777
      # A line without a leading ppid does not match.
      - constructorParams: []
        params:
          - line: usage-pulse-stub
        result: !undefined
      # Empty ps output does not match.
      - constructorParams: []
        params:
          - line: ""
        result: !undefined
  _resolveAppBundleFromComm:
    terms:
      # A plain terminal bundle path resolves to that bundle.
      - constructorParams: []
        params:
          - comm: /Applications/Ghostty.app/Contents/MacOS/ghostty
        result: /Applications/Ghostty.app
      # The leading dash of an Apple Silicon ps comm is not part of the path.
      - constructorParams: []
        params:
          - comm: -/Applications/Ghostty.app/Contents/MacOS/ghostty
        result: /Applications/Ghostty.app
      # A helper binary nested in the app frameworks resolves to the outer owning app.
      - constructorParams: []
        params:
          - comm: /Applications/Visual Studio Code.app/Contents/Frameworks/Code Helper.app/Contents/MacOS/Code Helper
        result: /Applications/Visual Studio Code.app
      # A segment that merely contains ".app" mid-name is not a bundle boundary.
      - constructorParams: []
        params:
          - comm: /opt/my.app.d/bin/terminal
        result: !undefined
