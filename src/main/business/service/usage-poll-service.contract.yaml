# Contract for the usage poll service background-polling gate.
# The contractor resolves flat callable subjects, so the terms drive the scenario
# functions in __tests__/_usage-poll-service-contract-harness.ts. Each scenario
# spies the settings repo singleton, installs fake timers, and drives one service
# instance through window-visibility and mobile-server-flag transitions,
# returning the provider poll count at every checkpoint. The polls themselves are
# stubbed, so only the scheduling decisions are under test.
subject: usagePollServiceContractHarness
module: ./__tests__/_usage-poll-service-contract-harness.js
subjectType: function
methods:
  claudeTokenRefreshFallbackOutcome:
    terms:
      # A 401 on a system-token Claude tracker with the fallback enabled triggers the CLI
      # token refresh seam with the tracker's configured command and retries the fetch once
      # with the refreshed token.
      - params:
          - accessTokenRefreshCommand: 'claude -p "what is your name, only name" --model haiku'
            accessTokenSource: SYSTEM
            firstCallErrorStatus: 401
            isAccessTokenRefreshEnabled: true
        result:
          fetchCallsCount: 2
          isRefreshCalled: true
          lastAccessToken: refreshed-access-token
          outcomeErrorMessage: ''
          refreshCommandUsed: 'claude -p "what is your name, only name" --model haiku'
      # A custom refresh command on the tracker is passed through to the CLI refresh seam.
      - params:
          - accessTokenRefreshCommand: 'claude -p ping --model haiku'
            accessTokenSource: SYSTEM
            firstCallErrorStatus: 401
            isAccessTokenRefreshEnabled: true
        result:
          fetchCallsCount: 2
          isRefreshCalled: true
          lastAccessToken: refreshed-access-token
          outcomeErrorMessage: ''
          refreshCommandUsed: 'claude -p ping --model haiku'
      # The fallback is off by default: a 401 on a system-token tracker that did not opt in
      # surfaces the original error without any CLI refresh.
      - params:
          - accessTokenRefreshCommand: 'claude -p "what is your name, only name" --model haiku'
            accessTokenSource: SYSTEM
            firstCallErrorStatus: 401
        result:
          fetchCallsCount: 1
          isRefreshCalled: false
          lastAccessToken: stale-access-token
          outcomeErrorMessage: request failed with status 401 Unauthorized
          refreshCommandUsed: ''
      # A 401 on a manually entered token is not refreshable through the CLI even with the
      # fallback enabled: the original error surfaces after a single fetch.
      - params:
          - accessTokenRefreshCommand: 'claude -p "what is your name, only name" --model haiku'
            accessTokenSource: MANUAL
            firstCallErrorStatus: 401
            isAccessTokenRefreshEnabled: true
        result:
          fetchCallsCount: 1
          isRefreshCalled: false
          lastAccessToken: stale-access-token
          outcomeErrorMessage: request failed with status 401 Unauthorized
          refreshCommandUsed: ''
      # A non-401 failure on the system token is not a token problem: no refresh, the
      # original error surfaces.
      - params:
          - accessTokenRefreshCommand: 'claude -p "what is your name, only name" --model haiku'
            accessTokenSource: SYSTEM
            firstCallErrorStatus: 500
            isAccessTokenRefreshEnabled: true
        result:
          fetchCallsCount: 1
          isRefreshCalled: false
          lastAccessToken: stale-access-token
          outcomeErrorMessage: request failed with status 500 Unauthorized
          refreshCommandUsed: ''
      # Without a first-fetch failure there is no refresh: a single fetch resolves.
      - params:
          - accessTokenRefreshCommand: 'claude -p "what is your name, only name" --model haiku'
            accessTokenSource: SYSTEM
            isAccessTokenRefreshEnabled: true
        result:
          fetchCallsCount: 1
          isRefreshCalled: false
          lastAccessToken: stale-access-token
          outcomeErrorMessage: ''
          refreshCommandUsed: ''
  windowVisibilityMatrixPollCounts:
    terms:
      # Mobile server disabled: a hidden window at start polls nothing, showing
      # the window polls once immediately and keeps scheduling every interval,
      # and hiding the window again stops all scheduling.
      - params:
          - intervalMs: 1000
        result:
          - 0
          - 1
          - 3
          - 3
  serverEnabledHiddenMatrixPollCounts:
    terms:
      # Mobile server enabled with the window hidden the whole time: start polls
      # immediately, polling keeps scheduling on the interval, and hiding an
      # already hidden window changes nothing.
      - params:
          - intervalMs: 1000
        result:
          - 1
          - 3
          - 5
  serverToggleMatrixPollCounts:
    terms:
      # Toggling the setting while hidden: disabled start polls nothing, the
      # restart after enabling resumes polling on the interval, and the restart
      # after disabling performs the single save-triggered poll and then stops
      # scheduling.
      - params:
          - intervalMs: 1000
        result:
          - 0
          - 1
          - 3
          - 4
          - 4
