# Contract for SettingsService.sanitizeSettings, pinning the session-finished-sound
# key migration and the session-finished pulse duration.
#
# Sound: sessionFinishedSoundId wins when valid, the legacy idleSoundId
# migrates when the new key is absent or invalid, and the success default applies
# when neither resolves.
#
# Pulse: sessionFinishedPulseMs is how long (in milliseconds) the finished card keeps
# pulsing its border. Only a finite number survives; anything else (absent, string,
# NaN, null) falls back to the 10 second default. Valid numbers clamp into
# [0, 60000] ms and round to whole milliseconds, so 0 (indicator off) and 60000 are
# kept as-is while 90000 saturates. The legacy sessionFinishedPulseSeconds key
# migrates by multiplying by 1000 when the ms key is absent, and a present ms key
# always wins. sessionsRefreshIntervalMs follows the same legacy
# sessionsRefreshIntervalSeconds migration.
#
# The runner matches results with a full deep equal (no
# partial matching), so every term pins the complete sanitized settings object the
# empty raw record deterministically produces: every other absent field falls back
# to its default, and trackers/triggers/sshHosts come back empty because the record
# carries no legacy token fields either.
subject: SettingsService
module: ./settings-service.js
subjectType: class
constructor:
  # No constructor params and no own fields: a fresh instance compares as an empty object.
  terms:
    - params: []
      result: {}
methods:
  sanitizeSettings:
    terms:
      # Both keys valid: the new sessionFinishedSoundId wins over the legacy idleSoundId.
      - constructorParams: []
        params:
          - rawSettings:
              idleSoundId: beep
              sessionFinishedSoundId: ding
        result:
          isSchedulingEnabled: false
          isSessionsAutoRefreshPaused: false
          sessionFinishedPulseMs: 10000
          sessionFinishedSoundId: ding
          sessionsRefreshIntervalMs: 5000
          soundVolumePercent: 40
          sshHosts: []
          trackers: []
          triggers: []
          waitingSoundId: chime
      # Only the legacy key present: idleSoundId migrates into sessionFinishedSoundId.
      - constructorParams: []
        params:
          - rawSettings:
              idleSoundId: fanfare
        result:
          isSchedulingEnabled: false
          isSessionsAutoRefreshPaused: false
          sessionFinishedPulseMs: 10000
          sessionFinishedSoundId: fanfare
          sessionsRefreshIntervalMs: 5000
          soundVolumePercent: 40
          sshHosts: []
          trackers: []
          triggers: []
          waitingSoundId: chime
      # Neither key present (empty record): the success default.
      - constructorParams: []
        params:
          - rawSettings: {}
        result:
          isSchedulingEnabled: false
          isSessionsAutoRefreshPaused: false
          sessionFinishedPulseMs: 10000
          sessionFinishedSoundId: success
          sessionsRefreshIntervalMs: 5000
          soundVolumePercent: 40
          sshHosts: []
          trackers: []
          triggers: []
          waitingSoundId: chime
      # An unknown value in the new key falls through to a valid legacy key.
      - constructorParams: []
        params:
          - rawSettings:
              idleSoundId: ping
              sessionFinishedSoundId: not-a-sound
        result:
          isSchedulingEnabled: false
          isSessionsAutoRefreshPaused: false
          sessionFinishedPulseMs: 10000
          sessionFinishedSoundId: ping
          sessionsRefreshIntervalMs: 5000
          soundVolumePercent: 40
          sshHosts: []
          trackers: []
          triggers: []
          waitingSoundId: chime
      # Invalid values in both keys: the success default.
      - constructorParams: []
        params:
          - rawSettings:
              idleSoundId: true
              sessionFinishedSoundId: 42
        result:
          isSchedulingEnabled: false
          isSessionsAutoRefreshPaused: false
          sessionFinishedPulseMs: 10000
          sessionFinishedSoundId: success
          sessionsRefreshIntervalMs: 5000
          soundVolumePercent: 40
          sshHosts: []
          trackers: []
          triggers: []
          waitingSoundId: chime
      # Legacy 'none' is a valid sound id: a user who had the idle sound disabled
      # stays disabled rather than being reset to the default.
      - constructorParams: []
        params:
          - rawSettings:
              idleSoundId: none
        result:
          isSchedulingEnabled: false
          isSessionsAutoRefreshPaused: false
          sessionFinishedPulseMs: 10000
          sessionFinishedSoundId: none
          sessionsRefreshIntervalMs: 5000
          soundVolumePercent: 40
          sshHosts: []
          trackers: []
          triggers: []
          waitingSoundId: chime
      # A whole number of milliseconds inside the range is kept as the pulse duration.
      - constructorParams: []
        params:
          - rawSettings:
              sessionFinishedPulseMs: 25000
        result:
          isSchedulingEnabled: false
          isSessionsAutoRefreshPaused: false
          sessionFinishedPulseMs: 25000
          sessionFinishedSoundId: success
          sessionsRefreshIntervalMs: 5000
          soundVolumePercent: 40
          sshHosts: []
          trackers: []
          triggers: []
          waitingSoundId: chime
      # Zero is a real choice (indicator off), not a missing value.
      - constructorParams: []
        params:
          - rawSettings:
              sessionFinishedPulseMs: 0
        result:
          isSchedulingEnabled: false
          isSessionsAutoRefreshPaused: false
          sessionFinishedPulseMs: 0
          sessionFinishedSoundId: success
          sessionsRefreshIntervalMs: 5000
          soundVolumePercent: 40
          sshHosts: []
          trackers: []
          triggers: []
          waitingSoundId: chime
      # Below the minimum clamps up to zero.
      - constructorParams: []
        params:
          - rawSettings:
              sessionFinishedPulseMs: -5000
        result:
          isSchedulingEnabled: false
          isSessionsAutoRefreshPaused: false
          sessionFinishedPulseMs: 0
          sessionFinishedSoundId: success
          sessionsRefreshIntervalMs: 5000
          soundVolumePercent: 40
          sshHosts: []
          trackers: []
          triggers: []
          waitingSoundId: chime
      # Above the maximum clamps down to a minute.
      - constructorParams: []
        params:
          - rawSettings:
              sessionFinishedPulseMs: 90000
        result:
          isSchedulingEnabled: false
          isSessionsAutoRefreshPaused: false
          sessionFinishedPulseMs: 60000
          sessionFinishedSoundId: success
          sessionsRefreshIntervalMs: 5000
          soundVolumePercent: 40
          sshHosts: []
          trackers: []
          triggers: []
          waitingSoundId: chime
      # A fractional millisecond count rounds to a whole number.
      - constructorParams: []
        params:
          - rawSettings:
              sessionFinishedPulseMs: 7600.6
        result:
          isSchedulingEnabled: false
          isSessionsAutoRefreshPaused: false
          sessionFinishedPulseMs: 7601
          sessionFinishedSoundId: success
          sessionsRefreshIntervalMs: 5000
          soundVolumePercent: 40
          sshHosts: []
          trackers: []
          triggers: []
          waitingSoundId: chime
      # A non-number falls back to the default rather than clamping.
      - constructorParams: []
        params:
          - rawSettings:
              sessionFinishedPulseMs: '20000'
        result:
          isSchedulingEnabled: false
          isSessionsAutoRefreshPaused: false
          sessionFinishedPulseMs: 10000
          sessionFinishedSoundId: success
          sessionsRefreshIntervalMs: 5000
          soundVolumePercent: 40
          sshHosts: []
          trackers: []
          triggers: []
          waitingSoundId: chime
      # Only the legacy seconds key present: 25 seconds migrates to 25000 ms.
      - constructorParams: []
        params:
          - rawSettings:
              sessionFinishedPulseSeconds: 25
        result:
          isSchedulingEnabled: false
          isSessionsAutoRefreshPaused: false
          sessionFinishedPulseMs: 25000
          sessionFinishedSoundId: success
          sessionsRefreshIntervalMs: 5000
          soundVolumePercent: 40
          sshHosts: []
          trackers: []
          triggers: []
          waitingSoundId: chime
      # The ms key wins when both the ms and the legacy seconds key are present.
      - constructorParams: []
        params:
          - rawSettings:
              sessionFinishedPulseMs: 30000
              sessionFinishedPulseSeconds: 45
        result:
          isSchedulingEnabled: false
          isSessionsAutoRefreshPaused: false
          sessionFinishedPulseMs: 30000
          sessionFinishedSoundId: success
          sessionsRefreshIntervalMs: 5000
          soundVolumePercent: 40
          sshHosts: []
          trackers: []
          triggers: []
          waitingSoundId: chime
      # The legacy sessions refresh seconds key migrates to ms too: 12 s becomes 12000 ms.
      - constructorParams: []
        params:
          - rawSettings:
              sessionsRefreshIntervalSeconds: 12
        result:
          isSchedulingEnabled: false
          isSessionsAutoRefreshPaused: false
          sessionFinishedPulseMs: 10000
          sessionFinishedSoundId: success
          sessionsRefreshIntervalMs: 12000
          soundVolumePercent: 40
          sshHosts: []
          trackers: []
          triggers: []
          waitingSoundId: chime
      # The sessions refresh ms key clamps like the pulse does: 1000 ms clamps up to the
      # 2 second minimum.
      - constructorParams: []
        params:
          - rawSettings:
              sessionsRefreshIntervalMs: 1000
        result:
          isSchedulingEnabled: false
          isSessionsAutoRefreshPaused: false
          sessionFinishedPulseMs: 10000
          sessionFinishedSoundId: success
          sessionsRefreshIntervalMs: 2000
          soundVolumePercent: 40
          sshHosts: []
          trackers: []
          triggers: []
          waitingSoundId: chime
