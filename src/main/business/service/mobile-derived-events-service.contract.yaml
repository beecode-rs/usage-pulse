# Contract for the mobile derived events service.
# The contractor resolves flat callable subjects, so the terms drive the scenario
# functions in __tests__/_mobile-derived-events-service-contract-harness.ts. Each
# scenario creates a fresh service instance, starts it, replays a sequence of
# snapshots on the shared app event bus, and returns every SESSION_FINISHED or
# USAGE_WARNING delivery captured while the service was running. The bus is a
# module singleton shared by every term in this file, so each scenario stops the
# service and unsubscribes before returning.
subject: mobileDerivedEventsServiceContractHarness
module: ./__tests__/_mobile-derived-events-service-contract-harness.js
subjectType: function
methods:
  sessionFinishedDeliveries:
    terms:
      # A session that was BUSY in the previous snapshot and IDLE in the current
      # one emits exactly one SESSION_FINISHED carrying the current session.
      - params:
          - snapshots:
              - fetchedAt: 1726000000000
                sessions:
                  - cwd: /home/user/proj-a
                    kind: claude-code
                    name: session-a
                    pid: 1234
                    sessionId: s-a
                    startedAt: 1726000000000
                    status: busy
                unreachableHosts: []
              - fetchedAt: 1726000001000
                sessions:
                  - cwd: /home/user/proj-a
                    kind: claude-code
                    name: session-a
                    pid: 1234
                    sessionId: s-a
                    startedAt: 1726000000000
                    status: idle
                unreachableHosts: []
        result:
          - cwd: /home/user/proj-a
            kind: claude-code
            name: session-a
            pid: 1234
            sessionId: s-a
            startedAt: 1726000000000
            status: idle
      # A session already IDLE in both snapshots emits nothing.
      - params:
          - snapshots:
              - fetchedAt: 1726000000000
                sessions:
                  - cwd: /home/user/proj-a
                    kind: claude-code
                    name: session-a
                    pid: 1234
                    sessionId: s-a
                    startedAt: 1726000000000
                    status: idle
                unreachableHosts: []
              - fetchedAt: 1726000001000
                sessions:
                  - cwd: /home/user/proj-a
                    kind: claude-code
                    name: session-a
                    pid: 1234
                    sessionId: s-a
                    startedAt: 1726000000000
                    status: idle
                unreachableHosts: []
        result: []
      # The first snapshot after start only records the previous state, so a lone
      # BUSY snapshot emits nothing.
      - params:
          - snapshots:
              - fetchedAt: 1726000000000
                sessions:
                  - cwd: /home/user/proj-a
                    kind: claude-code
                    name: session-a
                    pid: 1234
                    sessionId: s-a
                    startedAt: 1726000000000
                    status: busy
                unreachableHosts: []
        result: []
  usageWarningDeliveries:
    terms:
      # Crossing the high-usage boundary upward (80 then 90 percent) emits exactly
      # one HIGH_USAGE warning for the crossed window.
      - params:
          - snapshots:
              - providers:
                  - fetchedAt: 1726000000000
                    providerId: claude
                    status: OK
                    trackerId: tracker-main
                    trackerName: Claude
                    usage:
                      - label: 5h window
                        usedPercent: 80
              - providers:
                  - fetchedAt: 1726000001000
                    providerId: claude
                    status: OK
                    trackerId: tracker-main
                    trackerName: Claude
                    usage:
                      - label: 5h window
                        usedPercent: 90
        result:
          - reason: high-usage
            trackerId: tracker-main
            trackerName: Claude
            usedPercent: 90
            windowLabel: 5h window
      # A further upward crossing into limit-reached (90 then 96 percent) emits a
      # LIMIT_REACHED warning.
      - params:
          - snapshots:
              - providers:
                  - fetchedAt: 1726000000000
                    providerId: claude
                    status: OK
                    trackerId: tracker-main
                    trackerName: Claude
                    usage:
                      - label: 5h window
                        usedPercent: 90
              - providers:
                  - fetchedAt: 1726000001000
                    providerId: claude
                    status: OK
                    trackerId: tracker-main
                    trackerName: Claude
                    usage:
                      - label: 5h window
                        usedPercent: 96
        result:
          - reason: limit-reached
            trackerId: tracker-main
            trackerName: Claude
            usedPercent: 96
            windowLabel: 5h window
      # A downward crossing (96 then 60 percent) emits nothing.
      - params:
          - snapshots:
              - providers:
                  - fetchedAt: 1726000000000
                    providerId: claude
                    status: OK
                    trackerId: tracker-main
                    trackerName: Claude
                    usage:
                      - label: 5h window
                        usedPercent: 96
              - providers:
                  - fetchedAt: 1726000001000
                    providerId: claude
                    status: OK
                    trackerId: tracker-main
                    trackerName: Claude
                    usage:
                      - label: 5h window
                        usedPercent: 60
        result: []
      # A tracker transitioning from OK to ERROR emits one PROVIDER_ERROR warning
      # carrying the snapshot errorMessage.
      - params:
          - snapshots:
              - providers:
                  - fetchedAt: 1726000000000
                    providerId: claude
                    status: OK
                    trackerId: tracker-main
                    trackerName: Claude
                    usage:
                      - label: 5h window
                        usedPercent: 50
              - providers:
                  - errorMessage: request failed
                    fetchedAt: 1726000001000
                    providerId: claude
                    status: ERROR
                    trackerId: tracker-main
                    trackerName: Claude
        result:
          - errorMessage: request failed
            reason: provider-error
            trackerId: tracker-main
            trackerName: Claude
      # A tracker staying in ERROR emits nothing.
      - params:
          - snapshots:
              - providers:
                  - errorMessage: request failed
                    fetchedAt: 1726000000000
                    providerId: claude
                    status: ERROR
                    trackerId: tracker-main
                    trackerName: Claude
              - providers:
                  - errorMessage: request failed
                    fetchedAt: 1726000001000
                    providerId: claude
                    status: ERROR
                    trackerId: tracker-main
                    trackerName: Claude
        result: []
      # The first usage snapshot after start only records the previous state, so a
      # lone 90 percent snapshot emits nothing (no restart notification spam).
      - params:
          - snapshots:
              - providers:
                  - fetchedAt: 1726000000000
                    providerId: claude
                    status: OK
                    trackerId: tracker-main
                    trackerName: Claude
                    usage:
                      - label: 5h window
                        usedPercent: 90
        result: []
