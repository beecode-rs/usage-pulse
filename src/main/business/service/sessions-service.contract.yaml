# Contract for the session-terminal focus path of SessionsService.
# Declarative terms cover only the synchronous, child-process-free members of the focus path.
# The contract runner's error strategy asserts synchronous throws only, so every async
# rejection of the path (the windows platform dispatch, the Linux X11/Wayland and
# xdotool-install errors), the stubbed xdotool/ps choreography and the macos routing live in
# sessions-service.test.ts.
subject: _SessionsService
module: ./sessions-service-singleton.js
subjectType: class
constructor:
  # The only own field (_inFlightSnapshot) starts undefined, which the serialized comparison
  # omits, so a fresh instance compares as an empty object.
  terms:
    - params: []
      result: {}
methods:
  _parseFirstWindowId:
    terms:
      # Several window ids on separate lines -> the first line is the window to activate.
      - constructorParams: []
        params:
          - stdout: "123456\n789012\n345678\n"
        result: '123456'
      # A single window id with a trailing newline.
      - constructorParams: []
        params:
          - stdout: "123456\n"
        result: '123456'
      # A single window id without a trailing newline.
      - constructorParams: []
        params:
          - stdout: "123456"
        result: '123456'
      # Leading blank lines are trimmed away before the first line is taken.
      - constructorParams: []
        params:
          - stdout: "\n\n123456\n789012\n"
        result: '123456'
      # Empty stdout means xdotool found no window.
      - constructorParams: []
        params:
          - stdout: ""
        result: !undefined
      # Whitespace-only stdout means xdotool found no window.
      - constructorParams: []
        params:
          - stdout: " \n \n"
        result: !undefined
  _isXdotoolMissing:
    terms:
      # An ENOENT error code means the xdotool binary is not installed.
      - constructorParams: []
        params:
          - error:
              code: ENOENT
        result: true
      # Any other error code (timeout, non-zero exit) is not a missing binary.
      - constructorParams: []
        params:
          - error:
              code: ETIMEDOUT
        result: false
      # A codeless Error is not a missing-binary signal either.
      - constructorParams: []
        params:
          - error: new Error("spawn xdotool ENOENT")
        result: false
      # An object without a code is treated like any other failure.
      - constructorParams: []
        params:
          - error:
              message: command failed
        result: false
  _resolveLinuxWindowId:
    terms:
      # The ancestor walk gives up at the hop cap before consulting xdotool or ps.
      - constructorParams: []
        params:
          - hopCount: 12
            pid: 100
        result: !undefined
      # Hops beyond the cap short-circuit the same way.
      - constructorParams: []
        params:
          - hopCount: 20
            pid: 100
        result: !undefined
  _parseProcessLine:
    terms:
      # ps ppid/comm output for a live process parses into an entry.
      - constructorParams: []
        params:
          - line: "  777 /usr/bin/usage-pulse-stub"
        result:
          comm: /usr/bin/usage-pulse-stub
          ppid: 777
      # A line without a leading ppid does not match.
      - constructorParams: []
        params:
          - line: usage-pulse-stub
        result: !undefined
      # Empty ps output does not match.
      - constructorParams: []
        params:
          - line: ""
        result: !undefined
  _resolveAppBundleFromComm:
    terms:
      # A plain terminal bundle path resolves to that bundle.
      - constructorParams: []
        params:
          - comm: /Applications/Ghostty.app/Contents/MacOS/ghostty
        result: /Applications/Ghostty.app
      # The leading dash of an Apple Silicon ps comm is not part of the path.
      - constructorParams: []
        params:
          - comm: -/Applications/Ghostty.app/Contents/MacOS/ghostty
        result: /Applications/Ghostty.app
      # A helper binary nested in the app frameworks resolves to the outer owning app.
      - constructorParams: []
        params:
          - comm: /Applications/Visual Studio Code.app/Contents/Frameworks/Code Helper.app/Contents/MacOS/Code Helper
        result: /Applications/Visual Studio Code.app
      # A segment that merely contains ".app" mid-name is not a bundle boundary.
      - constructorParams: []
        params:
          - comm: /opt/my.app.d/bin/terminal
        result: !undefined
  _resolvePeerRank:
    terms:
      # Same-cwd sessions rank by surface host age: the newer session focuses the second match.
      - constructorParams: []
        params:
          - peers:
              - hostPid: 5100
                hostStartedAtMs: 1788357898000
                pid: 4242
              - hostPid: 6100
                hostStartedAtMs: 1788367210000
                pid: 7777
            pid: 7777
        result: 1
      # The session with the oldest surface host focuses the first match.
      - constructorParams: []
        params:
          - peers:
              - hostPid: 5100
                hostStartedAtMs: 1788357898000
                pid: 4242
              - hostPid: 6100
                hostStartedAtMs: 1788367210000
                pid: 7777
            pid: 4242
        result: 0
      # A peer without a start time sorts as the newest surface.
      - constructorParams: []
        params:
          - peers:
              - hostPid: 5100
                hostStartedAtMs: 1788357898000
                pid: 4242
              - hostPid: 6100
                pid: 7777
            pid: 7777
        result: 1
      # Same-start ties order by the lower host pid first.
      - constructorParams: []
        params:
          - peers:
              - hostPid: 6100
                hostStartedAtMs: 1000
                pid: 7777
              - hostPid: 5100
                hostStartedAtMs: 1000
                pid: 4242
            pid: 4242
        result: 0
      # A session missing from the peers focuses the first match.
      - constructorParams: []
        params:
          - peers:
              - hostPid: 5100
                hostStartedAtMs: 1788357898000
                pid: 4242
            pid: 9999
        result: 0
      # No peers at all focuses the first match.
      - constructorParams: []
        params:
          - peers: []
            pid: 4242
        result: 0
  _parseGhosttyFocusOutcome:
    terms:
      # The focused outcome reports the terminal window ended up front.
      - constructorParams: []
        params:
          - stdout: "focused\n"
        result: focused
      # The hidden outcome reports the window stayed off the front (another desktop, minimized).
      - constructorParams: []
        params:
          - stdout: hidden
        result: hidden
      # The missing outcome reports no terminal matched.
      - constructorParams: []
        params:
          - stdout: "missing\n"
        result: missing
      # Empty or unexpected stdout counts as no terminal matched.
      - constructorParams: []
        params:
          - stdout: ""
        result: missing
  _isVsCodeBundle:
    terms:
      # The stock VS Code bundle basename routes into the window-focus flow.
      - constructorParams: []
        params:
          - bundlePath: /Applications/Visual Studio Code.app
        result: true
      # A user-local install matches on basename alone.
      - constructorParams: []
        params:
          - bundlePath: /Users/user/Applications/Visual Studio Code.app
        result: true
      # Ghostty keeps its own tab-focus flow.
      - constructorParams: []
        params:
          - bundlePath: /Applications/Ghostty.app
        result: false
  _parseVsCodeWindowTitles:
    terms:
      # One title per linefeed-separated line, surrounding whitespace trimmed.
      - constructorParams: []
        params:
          - stdout: "◐ app.tsx — claude-code-helper\nemotify\n"
        result: ["◐ app.tsx — claude-code-helper", emotify]
      # A single title without a trailing newline.
      - constructorParams: []
        params:
          - stdout: emotify
        result: [emotify]
      # Empty stdout means no windows.
      - constructorParams: []
        params:
          - stdout: ""
        result: []
      # Whitespace-only stdout means no windows.
      - constructorParams: []
        params:
          - stdout: " \n \n"
        result: []
  _resolveVsCodeWorkspaceName:
    terms:
      # The workspace name is the text after the last em-dash separator.
      - constructorParams: []
        params:
          - windowTitle: "◐ session-focus-button.tsx — claude-code-helper"
        result: claude-code-helper
      # A window without an editor shows the workspace name alone.
      - constructorParams: []
        params:
          - windowTitle: emotify
        result: emotify
      # Only the last segment counts when the editor title itself contains separators.
      - constructorParams: []
        params:
          - windowTitle: "a — b — c"
        result: c
  _resolveVsCodeWorkspaceNameCandidates:
    terms:
      # Candidates are the last three path parts, deepest first.
      - constructorParams: []
        params:
          - cwd: /Users/milos/code/claude-code-helper
        result: [claude-code-helper, code, milos]
      # Longer paths are capped at three candidates.
      - constructorParams: []
        params:
          - cwd: /a/b/c/d/e
        result: [e, d, c]
      # A relative cwd yields its single segment.
      - constructorParams: []
        params:
          - cwd: claude-code-helper
        result: [claude-code-helper]
      # The filesystem root yields no candidates.
      - constructorParams: []
        params:
          - cwd: /
        result: []
  _resolveVsCodeWindowIndex:
    terms:
      # A window whose workspace name equals the cwd basename resolves to its one-based position.
      - constructorParams: []
        params:
          - cwd: /Users/milos/code/claude-code-helper
            windowTitles:
              - "◐ app.tsx — claude-code-helper"
              - emotify
        result: 1
      # A later window resolves to its own position.
      - constructorParams: []
        params:
          - cwd: /Users/milos/code/emotify
            windowTitles:
              - "◐ app.tsx — claude-code-helper"
              - emotify
        result: 2
      # A subdir cwd matches on the second candidate when no window matches the first.
      - constructorParams: []
        params:
          - cwd: /Users/milos/code/claude-code-helper/src
            windowTitles:
              - emotify
              - "Git Graph — bm (Workspace)"
              - "◐ app.tsx — claude-code-helper"
        result: 3
      # No candidate matching any window means no window to raise.
      - constructorParams: []
        params:
          - cwd: /Users/milos/code/claude-code-helper
            windowTitles:
              - emotify
        result: !undefined
  _resolveVsCodePermissionDeniedMessage:
    terms:
      # The System Events automation denial maps to its Automation-pane hint.
      - constructorParams: []
        params:
          - error: new Error("Not authorized to send Apple events to System Events (-1743)")
        result: "to focus the exact VS Code window, allow this app to control System Events in System Settings > Privacy & Security > Automation"
      # The assistive-access denial maps to its Accessibility-pane hint.
      - constructorParams: []
        params:
          - error: new Error("osascript is not allowed assistive access (-1719)")
        result: "to focus the exact VS Code window, allow this app to control your computer in System Settings > Privacy & Security > Accessibility"
      # Any other failure is not a permission denial.
      - constructorParams: []
        params:
          - error: new Error("window index out of range")
        result: !undefined
