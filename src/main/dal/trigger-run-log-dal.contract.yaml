# Contract for TriggerRunLogDal, the JSONL trigger run log storage: appended
# and written entries persist as one JSON object per line, and readLogLines
# returns the stored lines raw - one trimmed-nonblank string per line, in file
# order - without parsing, validating or filtering any of them. Line validity
# is the repo's concern (trigger-run-log-repo.contract.yaml); invalid and
# truncated lines pass through verbatim here. A term can only make a single
# call while the dal is stateful across calls, so the terms drive the scenario
# functions in __tests__/_trigger-run-log-dal-contract-harness.ts. Every
# scenario constructs its own dal pinned to a fresh temp file via the
# logFilePath constructor param, so nothing written in one term can leak into
# another. readLinesOnRawLines pre-writes arbitrary lines (string lines land
# verbatim, entry objects are serialized) to reach the read with input the dal
# itself would never produce.
subject: triggerRunLogDalContractHarness
module: ./__tests__/_trigger-run-log-dal-contract-harness.js
subjectType: function
methods:
  readLinesAfterAppend:
    terms:
      # appendLogEntry then readLogLines returns the entry as its one stored
      # JSONL line, including the empty-string skipReason the model allows.
      - params:
          - entries:
              - durationMs: 1250
                eventId: evt-1
                exitCode: 0
                outputSnippet: build done
                phase: finished
                skipReason: ''
                slot: '07:00'
                timestamp: '2026-09-15T07:00:00.000Z'
                trigger: os-schedule
                triggerId: trig-a
                triggerName: Morning
        result:
          - '{"durationMs":1250,"eventId":"evt-1","exitCode":0,"outputSnippet":"build
            done","phase":"finished","skipReason":"","slot":"07:00","timestamp":"2026-09-15T07:00:00.000Z","trigger":"os-schedule","triggerId":"trig-a","triggerName":"Morning"}'
      # A skipped entry with a real skipReason and the manual trigger source
      # round-trips too, covering every enum union member.
      - params:
          - entries:
              - durationMs: 0
                eventId: evt-3
                exitCode: 0
                outputSnippet: ''
                phase: skipped
                skipReason: not-scheduled-day
                slot: '12:02'
                timestamp: '2026-09-15T12:02:00.000Z'
                trigger: manual
                triggerId: trig-c
                triggerName: Noon
        result:
          - '{"durationMs":0,"eventId":"evt-3","exitCode":0,"outputSnippet":"","phase":"skipped","skipReason":"not-scheduled-day","slot":"12:02","timestamp":"2026-09-15T12:02:00.000Z","trigger":"manual","triggerId":"trig-c","triggerName":"Noon"}'
      # Sequential appends accumulate: both lines come back in write order.
      - params:
          - entries:
              - durationMs: 1250
                eventId: evt-1
                exitCode: 0
                outputSnippet: build done
                phase: finished
                skipReason: ''
                slot: '07:00'
                timestamp: '2026-09-15T07:00:00.000Z'
                trigger: os-schedule
                triggerId: trig-a
                triggerName: Morning
              - durationMs: 500
                eventId: evt-2
                exitCode: 0
                outputSnippet: starting up
                phase: started
                skipReason: ''
                slot: '17:05'
                timestamp: '2026-09-15T17:05:00.000Z'
                trigger: os-schedule
                triggerId: trig-b
                triggerName: Evening
        result:
          - '{"durationMs":1250,"eventId":"evt-1","exitCode":0,"outputSnippet":"build
            done","phase":"finished","skipReason":"","slot":"07:00","timestamp":"2026-09-15T07:00:00.000Z","trigger":"os-schedule","triggerId":"trig-a","triggerName":"Morning"}'
          - '{"durationMs":500,"eventId":"evt-2","exitCode":0,"outputSnippet":"starting
            up","phase":"started","skipReason":"","slot":"17:05","timestamp":"2026-09-15T17:05:00.000Z","trigger":"os-schedule","triggerId":"trig-b","triggerName":"Evening"}'
  readLinesAfterAppendWithRotation:
    terms:
      # With rotateMaxBytes at 1 byte every append rotates, and rotation keeps
      # only the last rotateKeepLineCount non-blank lines: appending three
      # entries with a keep count of 2 leaves the last two lines readable.
      - params:
          - entries:
              - durationMs: 1250
                eventId: evt-1
                exitCode: 0
                outputSnippet: build done
                phase: finished
                skipReason: ''
                slot: '07:00'
                timestamp: '2026-09-15T07:00:00.000Z'
                trigger: os-schedule
                triggerId: trig-a
                triggerName: Morning
              - durationMs: 0
                eventId: evt-3
                exitCode: 0
                outputSnippet: ''
                phase: skipped
                skipReason: not-scheduled-day
                slot: '12:02'
                timestamp: '2026-09-15T12:02:00.000Z'
                trigger: manual
                triggerId: trig-c
                triggerName: Noon
              - durationMs: 500
                eventId: evt-2
                exitCode: 0
                outputSnippet: starting up
                phase: started
                skipReason: ''
                slot: '17:05'
                timestamp: '2026-09-15T17:05:00.000Z'
                trigger: os-schedule
                triggerId: trig-b
                triggerName: Evening
            rotateKeepLineCount: 2
        result:
          - '{"durationMs":0,"eventId":"evt-3","exitCode":0,"outputSnippet":"","phase":"skipped","skipReason":"not-scheduled-day","slot":"12:02","timestamp":"2026-09-15T12:02:00.000Z","trigger":"manual","triggerId":"trig-c","triggerName":"Noon"}'
          - '{"durationMs":500,"eventId":"evt-2","exitCode":0,"outputSnippet":"starting
            up","phase":"started","skipReason":"","slot":"17:05","timestamp":"2026-09-15T17:05:00.000Z","trigger":"os-schedule","triggerId":"trig-b","triggerName":"Evening"}'
  readLinesAfterWrite:
    terms:
      # writeLogEntries replaces the whole file and the entries read back as
      # their one stored JSONL line each, in write order.
      - params:
          - entries:
              - durationMs: 1250
                eventId: evt-1
                exitCode: 0
                outputSnippet: build done
                phase: finished
                skipReason: ''
                slot: '07:00'
                timestamp: '2026-09-15T07:00:00.000Z'
                trigger: os-schedule
                triggerId: trig-a
                triggerName: Morning
              - durationMs: 500
                eventId: evt-2
                exitCode: 0
                outputSnippet: starting up
                phase: started
                skipReason: ''
                slot: '17:05'
                timestamp: '2026-09-15T17:05:00.000Z'
                trigger: os-schedule
                triggerId: trig-b
                triggerName: Evening
        result:
          - '{"durationMs":1250,"eventId":"evt-1","exitCode":0,"outputSnippet":"build
            done","phase":"finished","skipReason":"","slot":"07:00","timestamp":"2026-09-15T07:00:00.000Z","trigger":"os-schedule","triggerId":"trig-a","triggerName":"Morning"}'
          - '{"durationMs":500,"eventId":"evt-2","exitCode":0,"outputSnippet":"starting
            up","phase":"started","skipReason":"","slot":"17:05","timestamp":"2026-09-15T17:05:00.000Z","trigger":"os-schedule","triggerId":"trig-b","triggerName":"Evening"}'
  readLinesAfterWriteEmptyEntries:
    terms:
      # Writing no entries empties the file, and reading an empty file yields
      # no lines rather than an error.
      - params: []
        result: []
  readLinesOnMissingFile:
    terms:
      # A log file that does not exist yet reads as no lines.
      - params: []
        result: []
  readLinesOnRawLines:
    terms:
      # One stored entry line reads back as its raw string.
      - params:
          - lines:
              - durationMs: 1250
                eventId: evt-1
                exitCode: 0
                outputSnippet: build done
                phase: finished
                skipReason: ''
                slot: '07:00'
                timestamp: '2026-09-15T07:00:00.000Z'
                trigger: os-schedule
                triggerId: trig-a
                triggerName: Morning
        result:
          - '{"durationMs":1250,"eventId":"evt-1","exitCode":0,"outputSnippet":"build
            done","phase":"finished","skipReason":"","slot":"07:00","timestamp":"2026-09-15T07:00:00.000Z","trigger":"os-schedule","triggerId":"trig-a","triggerName":"Morning"}'
      # Blank lines are dropped, and every non-blank line passes through
      # verbatim - valid-JSON wrong-shape lines and truncated-JSON lines
      # included, side by side with the one valid entry line.
      - params:
          - lines:
              - ''
              - '{"junk":"value"}'
              - '{"durationMs": 1250'
              - durationMs: 1250
                eventId: evt-1
                exitCode: 0
                outputSnippet: build done
                phase: finished
                skipReason: ''
                slot: '07:00'
                timestamp: '2026-09-15T07:00:00.000Z'
                trigger: os-schedule
                triggerId: trig-a
                triggerName: Morning
              - ''
        result:
          - '{"junk":"value"}'
          - '{"durationMs": 1250'
          - '{"durationMs":1250,"eventId":"evt-1","exitCode":0,"outputSnippet":"build
            done","phase":"finished","skipReason":"","slot":"07:00","timestamp":"2026-09-15T07:00:00.000Z","trigger":"os-schedule","triggerId":"trig-a","triggerName":"Morning"}'
      # Blank, wrong-shape and truncated lines alone come back verbatim with
      # the blanks dropped.
      - params:
          - lines:
              - ''
              - ''
              - '{"junk":"value"}'
              - '{"durationMs": 1250'
        result:
          - '{"junk":"value"}'
          - '{"durationMs": 1250'
