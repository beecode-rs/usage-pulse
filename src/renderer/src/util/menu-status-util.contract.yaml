# Contract for MenuStatusUtil.
# Terms pin the side-menu status dots. The usage dot is 'error' when any provider
# snapshot reports UsageActivityStatus.ERROR, else 'warning' when any usage window is
# outpacing the window (usage percent at least 10 points ahead of the
# elapsed-window percent); remaining time alone never warns. The sessions dot is
# 'error' when loading failed or the snapshot carries an error message, else 'waiting'
# when any session waits. The peak dot is 'peak' while any tracked z.ai provider sits
# inside its 3x-credit peak window. The combined dot ranks
# error > warning > waiting > peak.
# All terms use now: 0 and windowMs: 3600000 unless stated, so resetAt encodes the
# remaining share directly (resetAt 1800000 leaves exactly half the window).
subject: MenuStatusUtil
module: ./menu-status-util.js
subjectType: class
constructor:
  # A fresh instance carries no own fields, so it serializes as an empty object.
  terms:
    - params: []
      result: {}
methods:
  resolveCombinedStatusDot:
    terms:
      # Error outranks waiting.
      - constructorParams: []
        params:
          - dots:
              - waiting
              - error
        result: error
      # Warning outranks waiting.
      - constructorParams: []
        params:
          - dots:
              - waiting
              - warning
        result: warning
      # Warning survives undefined entries from areas without a dot.
      - constructorParams: []
        params:
          - dots:
              - !undefined
              - warning
              - !undefined
        result: warning
      # A lone waiting dot passes through.
      - constructorParams: []
        params:
          - dots:
              - !undefined
              - waiting
        result: waiting
      # Waiting outranks the informational peak dot.
      - constructorParams: []
        params:
          - dots:
              - peak
              - waiting
        result: waiting
      # A lone peak dot passes through as the weakest rank.
      - constructorParams: []
        params:
          - dots:
              - !undefined
              - peak
        result: peak
      # Neither area produced a dot.
      - constructorParams: []
        params:
          - dots:
              - !undefined
              - !undefined
        result: !undefined
      # No dots at all.
      - constructorParams: []
        params:
          - dots: []
        result: !undefined
  resolveDevelopmentStatusDot:
    terms:
      # The development playground builds a synthetic snapshot from the elapsed-minutes
      # dial (0-300 spans the whole window, so elapsed percent = elapsedMinutes / 3 for
      # both the 5-hour and the 30-day window) and reuses the usage warning rules. The
      # provider is always OK, so 'error' is unreachable.
      # All terms use now: 0.
      #
      # Pace warning: 85% used at 60 elapsed minutes (20% elapsed) is drift +65, far
      # past the +10 outpacing threshold.
      - constructorParams: []
        params:
          - elapsedMinutes: 60
            now: 0
            usedPercent: 85
        result: warning
      # 65% used at 60 elapsed minutes is drift +45: still past the +10 threshold.
      - constructorParams: []
        params:
          - elapsedMinutes: 60
            now: 0
            usedPercent: 65
        result: warning
      # Boundary: 30% used at 20% elapsed is exactly drift +10 and warns.
      - constructorParams: []
        params:
          - elapsedMinutes: 60
            now: 0
            usedPercent: 30
        result: warning
      # One point shy: 29% used at 20% elapsed is drift +9 and stays clean.
      - constructorParams: []
        params:
          - elapsedMinutes: 60
            now: 0
            usedPercent: 29
        result: !undefined
      # Late window (284 of 300 minutes elapsed) with usage far under pace stays clean.
      - constructorParams: []
        params:
          - elapsedMinutes: 284
            now: 0
            usedPercent: 10
        result: !undefined
      # Drift +2 (62% used at 180 elapsed = 60% elapsed) stays inside the band.
      - constructorParams: []
        params:
          - elapsedMinutes: 180
            now: 0
            usedPercent: 62
        result: !undefined
      # Drift +6 (the first red pace step) is no longer enough to warn.
      - constructorParams: []
        params:
          - elapsedMinutes: 180
            now: 0
            usedPercent: 66
        result: !undefined
      # 285 elapsed minutes leaves exactly 5% remaining in BOTH windows (900000 of
      # 18000000 and 129600000 of 2592000000), pinning the integer-exact
      # multiply-before-divide resetAt derivation — with usage far under pace it stays
      # clean: nearing reset alone does not warn.
      - constructorParams: []
        params:
          - elapsedMinutes: 285
            now: 0
            usedPercent: 10
        result: !undefined
      # Max dials: full quota on a fresh window warns via pace; empty fresh window is clean.
      - constructorParams: []
        params:
          - elapsedMinutes: 0
            now: 0
            usedPercent: 100
        result: warning
      - constructorParams: []
        params:
          - elapsedMinutes: 0
            now: 0
            usedPercent: 0
        result: !undefined
      # Fully elapsed window (300 minutes) with zero usage: elapsed alone never warns.
      - constructorParams: []
        params:
          - elapsedMinutes: 300
            now: 0
            usedPercent: 0
        result: !undefined
  resolveIsWindowWarning:
    terms:
      # A window without a reset time never warns, however much of the quota is used.
      - constructorParams: []
        params:
          - now: 0
            usedPercent: 90
            windowMs: 3600000
        result: false
      # A window without a window length never warns either.
      - constructorParams: []
        params:
          - now: 0
            resetAt: 3600000
            usedPercent: 90
        result: false
      # Nearing reset (5% remaining, resetAt 180000 of 3600000) with usage far under
      # pace does not warn.
      - constructorParams: []
        params:
          - now: 0
            resetAt: 180000
            usedPercent: 10
            windowMs: 3600000
        result: false
      # Warning via pace: 80% used at 20% elapsed is drift +60, far past the +10
      # outpacing threshold.
      - constructorParams: []
        params:
          - now: 0
            resetAt: 2880000
            usedPercent: 80
            windowMs: 3600000
        result: true
      # Boundary: 20% used at 10% elapsed is exactly drift +10 and warns.
      - constructorParams: []
        params:
          - now: 0
            resetAt: 3240000
            usedPercent: 20
            windowMs: 3600000
        result: true
      # Mid-window and on pace (drift 0) stays clean.
      - constructorParams: []
        params:
          - now: 0
            resetAt: 1800000
            usedPercent: 50
            windowMs: 3600000
        result: false
  resolvePeakStatusDot:
    terms:
      # z.ai peak hours are weekdays 14:00-18:00 UTC+8. Terms use the UTC+8 wall clock of
      # Wednesday 2026-08-26 (peak 1787724000000-1787738400000) and of Saturday
      # 2026-08-29 (1787990400000 is that day's 16:00 UTC+8).
      #
      # No snapshot at all (usage not loaded yet).
      - constructorParams: []
        params:
          - now: 1787731200000
        result: !undefined
      # Snapshot with no providers.
      - constructorParams: []
        params:
          - now: 1787731200000
            snapshot:
              providers: []
        result: !undefined
      # A z.ai tracker mid-peak flags peak, even while it is still loading.
      - constructorParams: []
        params:
          - now: 1787731200000
            snapshot:
              providers:
                - providerId: zai
                  status: PENDING
                  trackerId: t-zai
                  trackerName: z.ai
        result: peak
      # A z.ai tracker among other providers flags peak.
      - constructorParams: []
        params:
          - now: 1787731200000
            snapshot:
              providers:
                - providerId: claude
                  status: OK
                  trackerId: t-claude
                  trackerName: Claude
                - providerId: zai
                  status: OK
                  trackerId: t-zai
                  trackerName: z.ai
        result: peak
      # Peak hours belong to z.ai only: other providers never flag peak.
      - constructorParams: []
        params:
          - now: 1787731200000
            snapshot:
              providers:
                - providerId: claude
                  status: OK
                  trackerId: t-claude
                  trackerName: Claude
                - providerId: dummy
                  status: OK
                  trackerId: t-dummy
                  trackerName: Dummy
        result: !undefined
      # An hour past the weekday peak window.
      - constructorParams: []
        params:
          - now: 1787742000000
            snapshot:
              providers:
                - providerId: zai
                  status: OK
                  trackerId: t-zai
                  trackerName: z.ai
        result: !undefined
      # Saturday 16:00 UTC+8 is inside the daily hours but outside the weekday window.
      - constructorParams: []
        params:
          - now: 1787990400000
            snapshot:
              providers:
                - providerId: zai
                  status: OK
                  trackerId: t-zai
                  trackerName: z.ai
        result: !undefined
  resolveSessionsStatusDot:
    terms:
      # No snapshot at all (sessions view not loaded yet).
      - constructorParams: []
        params:
          - {}
        result: !undefined
      # Healthy snapshot: no error message and only active sessions.
      - constructorParams: []
        params:
          - snapshot:
              fetchedAt: 0
              sessions:
                - cwd: /a
                  kind: claude
                  name: s1
                  pid: 1
                  sessionId: sid-1
                  startedAt: 0
                  status: busy
              unreachableHosts: []
        result: !undefined
      # Empty sessions list with no error message.
      - constructorParams: []
        params:
          - snapshot:
              fetchedAt: 0
              sessions: []
              unreachableHosts: []
        result: !undefined
      # A waiting session anywhere in the list (here: middle of three) waits.
      - constructorParams: []
        params:
          - snapshot:
              fetchedAt: 0
              sessions:
                - cwd: /a
                  kind: claude
                  name: s1
                  pid: 1
                  sessionId: sid-1
                  startedAt: 0
                  status: busy
                - cwd: /b
                  kind: claude
                  name: s2
                  pid: 2
                  sessionId: sid-2
                  startedAt: 0
                  status: waiting
                - cwd: /c
                  kind: claude
                  name: s3
                  pid: 3
                  sessionId: sid-3
                  startedAt: 0
                  status: idle
              unreachableHosts: []
        result: waiting
      # An empty-string error message is not an error: the waiting session still wins.
      - constructorParams: []
        params:
          - snapshot:
              errorMessage: ''
              fetchedAt: 0
              sessions:
                - cwd: /a
                  kind: claude
                  name: s1
                  pid: 1
                  sessionId: sid-1
                  startedAt: 0
                  status: waiting
              unreachableHosts: []
        result: waiting
      # A snapshot error message outranks a waiting session.
      - constructorParams: []
        params:
          - snapshot:
              errorMessage: ssh unreachable
              fetchedAt: 0
              sessions:
                - cwd: /a
                  kind: claude
                  name: s1
                  pid: 1
                  sessionId: sid-1
                  startedAt: 0
                  status: waiting
              unreachableHosts: []
        result: error
      # A load failure flags error even when the snapshot itself looks healthy.
      - constructorParams: []
        params:
          - hasLoadError: true
            snapshot:
              fetchedAt: 0
              sessions: []
              unreachableHosts: []
        result: error
  resolveUsageActivityStatusDot:
    terms:
      # No snapshot at all (usage not loaded yet).
      - constructorParams: []
        params:
          - now: 0
        result: !undefined
      # Snapshot with no providers.
      - constructorParams: []
        params:
          - now: 0
            snapshot:
              providers: []
        result: !undefined
      # Single healthy provider: mid-window and on pace.
      - constructorParams: []
        params:
          - now: 0
            snapshot:
              providers:
                - providerId: claude
                  status: OK
                  trackerId: t-claude
                  trackerName: Claude
                  usage:
                    - label: 5h
                      resetAt: 1800000
                      usedPercent: 50
                      windowMs: 3600000
        result: !undefined
      # One errored tracker among healthy ones flags error.
      - constructorParams: []
        params:
          - now: 0
            snapshot:
              providers:
                - providerId: claude
                  status: OK
                  trackerId: t-claude
                  trackerName: Claude
                  usage:
                    - label: 5h
                      resetAt: 1800000
                      usedPercent: 50
                      windowMs: 3600000
                - providerId: zai
                  status: ERROR
                  trackerId: t-zai
                  trackerName: z.ai
                - providerId: dummy
                  status: OK
                  trackerId: t-dummy
                  trackerName: Dummy
                  usage:
                    - label: 5h
                      resetAt: 1800000
                      usedPercent: 50
                      windowMs: 3600000
        result: error
      # An errored provider outranks a warning window on another provider.
      - constructorParams: []
        params:
          - now: 0
            snapshot:
              providers:
                - providerId: zai
                  status: ERROR
                  trackerId: t-zai
                  trackerName: z.ai
                - providerId: claude
                  status: OK
                  trackerId: t-claude
                  trackerName: Claude
                  usage:
                    - label: 5h
                      resetAt: 180000
                      usedPercent: 50
                      windowMs: 3600000
        result: error
      # Nearing reset (5% remaining) on the second provider with usage under pace does
      # not warn.
      - constructorParams: []
        params:
          - now: 0
            snapshot:
              providers:
                - providerId: claude
                  status: OK
                  trackerId: t-claude
                  trackerName: Claude
                  usage:
                    - label: 5h
                      resetAt: 1800000
                      usedPercent: 50
                      windowMs: 3600000
                - providerId: zai
                  status: OK
                  trackerId: t-zai
                  trackerName: z.ai
                  usage:
                    - label: 5h
                      resetAt: 180000
                      usedPercent: 50
                      windowMs: 3600000
        result: !undefined
      # One millisecond more remaining, still under pace: clean.
      - constructorParams: []
        params:
          - now: 0
            snapshot:
              providers:
                - providerId: claude
                  status: OK
                  trackerId: t-claude
                  trackerName: Claude
                  usage:
                    - label: 5h
                      resetAt: 180001
                      usedPercent: 50
                      windowMs: 3600000
        result: !undefined
      # Warning via pace: 80% used at 20% elapsed is drift +60, far past the +10
      # outpacing threshold.
      - constructorParams: []
        params:
          - now: 0
            snapshot:
              providers:
                - providerId: claude
                  status: OK
                  trackerId: t-claude
                  trackerName: Claude
                  usage:
                    - label: 5h
                      resetAt: 2880000
                      usedPercent: 80
                      windowMs: 3600000
        result: warning
      # Drift +20 (40% used at 20% elapsed) is past the +10 threshold and warns.
      - constructorParams: []
        params:
          - now: 0
            snapshot:
              providers:
                - providerId: claude
                  status: OK
                  trackerId: t-claude
                  trackerName: Claude
                  usage:
                    - label: 5h
                      resetAt: 2880000
                      usedPercent: 40
                      windowMs: 3600000
        result: warning
      # Drift +3 (23% used at 20% elapsed) stays inside the on-pace band.
      - constructorParams: []
        params:
          - now: 0
            snapshot:
              providers:
                - providerId: claude
                  status: OK
                  trackerId: t-claude
                  trackerName: Claude
                  usage:
                    - label: 5h
                      resetAt: 2880000
                      usedPercent: 23
                      windowMs: 3600000
        result: !undefined
      # Under pace (drift -30: 10% used at 40% elapsed) never warns.
      - constructorParams: []
        params:
          - now: 0
            snapshot:
              providers:
                - providerId: claude
                  status: OK
                  trackerId: t-claude
                  trackerName: Claude
                  usage:
                    - label: 5h
                      resetAt: 2160000
                      usedPercent: 10
                      windowMs: 3600000
        result: !undefined
      # A window without resetAt never warns, however much of the quota is used.
      - constructorParams: []
        params:
          - now: 0
            snapshot:
              providers:
                - providerId: claude
                  status: OK
                  trackerId: t-claude
                  trackerName: Claude
                  usage:
                    - label: 5h
                      usedPercent: 90
                      windowMs: 3600000
        result: !undefined
      # A window without windowMs never warns either.
      - constructorParams: []
        params:
          - now: 0
            snapshot:
              providers:
                - providerId: claude
                  status: OK
                  trackerId: t-claude
                  trackerName: Claude
                  usage:
                    - label: 5h
                      resetAt: 3600000
                      usedPercent: 90
        result: !undefined
      # A window already past its reset time (now after resetAt) with zero usage stays
      # clean: elapsed alone never warns.
      - constructorParams: []
        params:
          - now: 4000000
            snapshot:
              providers:
                - providerId: claude
                  status: OK
                  trackerId: t-claude
                  trackerName: Claude
                  usage:
                    - label: 5h
                      resetAt: 3600000
                      usedPercent: 0
                      windowMs: 3600000
        result: !undefined
