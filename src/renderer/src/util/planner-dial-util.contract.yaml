subject: PlannerDialUtil
module: ./planner-dial-util.js
subjectType: class
constructor:
  # A fresh instance carries no own fields, so it serializes as an empty object.
  terms:
    - params: []
      result: {}
methods:
  resolveDialDeltaDegrees:
    terms:
      # Arc start (135° in SVG y-down coords, bottom-left of the dial) maps to delta 0.
      - constructorParams: []
        params:
          - angleDegrees: 135
        result: 0
      # Arc midpoint (top of the dial) is half the 270° sweep.
      - constructorParams: []
        params:
          - angleDegrees: 270
        result: 135
      # End convention: the sweep ends at 405°, which is the same point as 45° (bottom-right).
      - constructorParams: []
        params:
          - angleDegrees: 405
        result: 270
      - constructorParams: []
        params:
          - angleDegrees: 45
        result: 270
      # Dead zone (the 90° bottom gap, deltas 270–360) snaps to the nearer arc end;
      # 80° sits 35° from the end and 55° from the start, so it snaps to the end.
      - constructorParams: []
        params:
          - angleDegrees: 80
        result: 270
      # 100° sits 35° from the start and 55° from the end, so it snaps to the start.
      - constructorParams: []
        params:
          - angleDegrees: 100
        result: 0
      # Dead-zone midpoint (90°, delta 315) is an exact tie and snaps to the start.
      - constructorParams: []
        params:
          - angleDegrees: 90
        result: 0
  resolveSteppedValue:
    terms:
      # Off-step raw values round to the nearest step.
      - constructorParams: []
        params:
          - max: 23
            min: 0
            rawValue: 10.4
            step: 1
        result: 10
      - constructorParams: []
        params:
          - max: 23
            min: 0
            rawValue: 10.6
            step: 1
        result: 11
      # 15-minute steps round to the nearest quarter hour.
      - constructorParams: []
        params:
          - max: 1425
            min: 0
            rawValue: 100
            step: 15
        result: 105
      - constructorParams: []
        params:
          - max: 1425
            min: 0
            rawValue: 92
            step: 15
        result: 90
      # Rounding is relative to min, not to zero.
      - constructorParams: []
        params:
          - max: 16
            min: 1
            rawValue: 4.4
            step: 1
        result: 4
      # Raw values beyond the range clamp to the bounds.
      - constructorParams: []
        params:
          - max: 23
            min: 0
            rawValue: -5
            step: 1
        result: 0
      - constructorParams: []
        params:
          - max: 23
            min: 0
            rawValue: 99
            step: 1
        result: 23
  resolvePointerValue:
    terms:
      # Pointer at the arc start (bottom-left, atan2(1, -1) = 135°) resolves to min.
      - constructorParams: []
        params:
          - dx: -1
            dy: 1
            max: 23
            min: 0
            step: 1
        result: 0
      # Pointer at the arc end (bottom-right, atan2(1, 1) = 45°) resolves to max.
      - constructorParams: []
        params:
          - dx: 1
            dy: 1
            max: 23
            min: 0
            step: 1
        result: 23
      # Pointer straight up (atan2(-1, 0) = -90°) is half the sweep; 11.5 rounds up to 12.
      - constructorParams: []
        params:
          - dx: 0
            dy: -1
            max: 23
            min: 0
            step: 1
        result: 12
      # Pointer straight down is the dead-zone tie and resolves to min.
      - constructorParams: []
        params:
          - dx: 0
            dy: 1
            max: 23
            min: 0
            step: 1
        result: 0
  resolveKeyboardValue:
    terms:
      # ArrowUp/ArrowRight increase by one step.
      - constructorParams: []
        params:
          - key: ArrowUp
            max: 23
            min: 0
            step: 1
            value: 10
        result: 11
      - constructorParams: []
        params:
          - key: ArrowRight
            max: 23
            min: 0
            step: 1
            value: 10
        result: 11
      # ArrowDown/ArrowLeft decrease by one step.
      - constructorParams: []
        params:
          - key: ArrowDown
            max: 23
            min: 0
            step: 1
            value: 10
        result: 9
      - constructorParams: []
        params:
          - key: ArrowLeft
            max: 23
            min: 0
            step: 1
            value: 10
        result: 9
      # Stepping past the bounds clamps instead of wrapping.
      - constructorParams: []
        params:
          - key: ArrowDown
            max: 23
            min: 0
            step: 1
            value: 0
        result: 0
      - constructorParams: []
        params:
          - key: ArrowUp
            max: 23
            min: 0
            step: 1
            value: 23
        result: 23
      # Home/End jump to the bounds; other keys leave the value unchanged.
      - constructorParams: []
        params:
          - key: Home
            max: 23
            min: 0
            step: 1
            value: 10
        result: 0
      - constructorParams: []
        params:
          - key: End
            max: 23
            min: 0
            step: 1
            value: 10
        result: 23
      - constructorParams: []
        params:
          - key: x
            max: 23
            min: 0
            step: 1
            value: 7
        result: 7
  resolveValueAngleDegrees:
    terms:
      # Value-to-angle inverse: min sits at 135°, max at 405° (= 45°), mid at the top (270°).
      - constructorParams: []
        params:
          - max: 23
            min: 0
            value: 0
        result: 135
      - constructorParams: []
        params:
          - max: 23
            min: 0
            value: 23
        result: 405
      - constructorParams: []
        params:
          - max: 16
            min: 1
            value: 8.5
        result: 270
