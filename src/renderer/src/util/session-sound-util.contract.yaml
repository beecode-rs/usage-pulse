# Contract for SessionSoundUtil.
# Terms pin the session sound triggers (playSessionSound itself drives the Web Audio
# API and stays untested here). resolveNewlyStatusSessionIds answers "which
# sessions just entered the given status" (the waiting sound): with no previous
# snapshot (first poll) nobody is new, otherwise a session is newly in the status
# when it has that status now and anything else before — including sessions absent
# from the previous snapshot entirely. Sessions that keep the status or leave it
# never trigger. resolveStatusTransitionSessionIds answers "which sessions moved
# from one exact status to another" (the finished sound, busy to idle): a session
# triggers only when the same sessionId had fromStatus in the previous snapshot and
# has toStatus now, so unlike the newly-variant a session absent from the previous
# snapshot never matches, and the first poll (no previous snapshot) returns nobody.
# fromStatus/toStatus are parameters, so the same resolver answers other
# transitions (e.g. idle to busy). resolveSoundGain clamps the volume percent to
# [0, 100] and maps it linearly onto gain [0, 0.4]. Volume 40 (the app default)
# divides before multiplying, so the exact double is 0.16000000000000003 — the
# nearest representable neighbor of 0.16.
subject: SessionSoundUtil
module: ./session-sound-util.js
subjectType: class
constructor:
  # A fresh instance carries no own fields (the AudioContext cache is module-level),
  # so it serializes as an empty object.
  terms:
    - params: []
      result: {}
methods:
  resolveSoundGain:
    terms:
      # Muted volume maps to silence (playSessionSound skips gain <= 0).
      - constructorParams: []
        params:
          - volumePercent: 0
        result: 0
      # A quarter volume: 25 / 100 * 0.4.
      - constructorParams: []
        params:
          - volumePercent: 25
        result: 0.1
      # The app default volume: 40 / 100 * 0.4, which lands one ULP above 0.16
      # because 40 / 100 rounds before the multiply by 0.4.
      - constructorParams: []
        params:
          - volumePercent: 40
        result: 0.16000000000000003
      # Half volume maps to half the max gain.
      - constructorParams: []
        params:
          - volumePercent: 50
        result: 0.2
      # Full volume maps to the max gain.
      - constructorParams: []
        params:
          - volumePercent: 100
        result: 0.4
      # Below the minimum clamps to silence.
      - constructorParams: []
        params:
          - volumePercent: -5
        result: 0
      # Above the maximum clamps to the max gain.
      - constructorParams: []
        params:
          - volumePercent: 120
        result: 0.4
  resolveNewlyStatusSessionIds:
    terms:
      # First snapshot (no previous sessions yet): nobody is newly waiting, even
      # when sessions are already waiting.
      - constructorParams: []
        params:
          - currentSessions:
              - cwd: /a
                kind: claude
                name: s1
                pid: 1
                sessionId: sid-1
                startedAt: 0
                status: waiting
            previousSessions: !undefined
            status: waiting
        result: []
      # Both snapshots empty.
      - constructorParams: []
        params:
          - currentSessions: []
            previousSessions: []
            status: waiting
        result: []
      # Empty previous snapshot (as opposed to missing): every currently waiting
      # session counts as new.
      - constructorParams: []
        params:
          - currentSessions:
              - cwd: /a
                kind: claude
                name: s1
                pid: 1
                sessionId: sid-1
                startedAt: 0
                status: waiting
            previousSessions: []
            status: waiting
        result:
          - sid-1
      # Simplest waiting transition: idle becomes waiting.
      - constructorParams: []
        params:
          - currentSessions:
              - cwd: /a
                kind: claude
                name: s1
                pid: 1
                sessionId: sid-1
                startedAt: 0
                status: waiting
            previousSessions:
              - cwd: /a
                kind: claude
                name: s1
                pid: 1
                sessionId: sid-1
                startedAt: 0
                status: idle
            status: waiting
        result:
          - sid-1
      # Simplest idle transition: busy becomes idle.
      - constructorParams: []
        params:
          - currentSessions:
              - cwd: /a
                kind: claude
                name: s1
                pid: 1
                sessionId: sid-1
                startedAt: 0
                status: idle
            previousSessions:
              - cwd: /a
                kind: claude
                name: s1
                pid: 1
                sessionId: sid-1
                startedAt: 0
                status: busy
            status: idle
        result:
          - sid-1
      # Waiting becomes idle is a fresh idle transition, but not a waiting one.
      - constructorParams: []
        params:
          - currentSessions:
              - cwd: /a
                kind: claude
                name: s1
                pid: 1
                sessionId: sid-1
                startedAt: 0
                status: idle
            previousSessions:
              - cwd: /a
                kind: claude
                name: s1
                pid: 1
                sessionId: sid-1
                startedAt: 0
                status: waiting
            status: idle
        result:
          - sid-1
      # The full matrix for waiting: sid-1 stays waiting (no beep), sid-2 goes
      # busy to waiting (beep), sid-3 leaves waiting (no beep), sid-4 is new but
      # idle (no beep), sid-5 is new and waiting (beep).
      - constructorParams: []
        params:
          - currentSessions:
              - cwd: /a
                kind: claude
                name: s1
                pid: 1
                sessionId: sid-1
                startedAt: 0
                status: waiting
              - cwd: /b
                kind: claude
                name: s2
                pid: 2
                sessionId: sid-2
                startedAt: 0
                status: waiting
              - cwd: /c
                kind: claude
                name: s3
                pid: 3
                sessionId: sid-3
                startedAt: 0
                status: busy
              - cwd: /d
                kind: claude
                name: s4
                pid: 4
                sessionId: sid-4
                startedAt: 0
                status: idle
              - cwd: /e
                kind: claude
                name: s5
                pid: 5
                sessionId: sid-5
                startedAt: 0
                status: waiting
            previousSessions:
              - cwd: /a
                kind: claude
                name: s1
                pid: 1
                sessionId: sid-1
                startedAt: 0
                status: waiting
              - cwd: /b
                kind: claude
                name: s2
                pid: 2
                sessionId: sid-2
                startedAt: 0
                status: busy
              - cwd: /c
                kind: claude
                name: s3
                pid: 3
                sessionId: sid-3
                startedAt: 0
                status: waiting
            status: waiting
        result:
          - sid-2
          - sid-5
      # The same matrix for idle: only sid-4 (new and idle) and nobody else.
      - constructorParams: []
        params:
          - currentSessions:
              - cwd: /a
                kind: claude
                name: s1
                pid: 1
                sessionId: sid-1
                startedAt: 0
                status: waiting
              - cwd: /b
                kind: claude
                name: s2
                pid: 2
                sessionId: sid-2
                startedAt: 0
                status: waiting
              - cwd: /c
                kind: claude
                name: s3
                pid: 3
                sessionId: sid-3
                startedAt: 0
                status: busy
              - cwd: /d
                kind: claude
                name: s4
                pid: 4
                sessionId: sid-4
                startedAt: 0
                status: idle
              - cwd: /e
                kind: claude
                name: s5
                pid: 5
                sessionId: sid-5
                startedAt: 0
                status: waiting
            previousSessions:
              - cwd: /a
                kind: claude
                name: s1
                pid: 1
                sessionId: sid-1
                startedAt: 0
                status: waiting
              - cwd: /b
                kind: claude
                name: s2
                pid: 2
                sessionId: sid-2
                startedAt: 0
                status: busy
              - cwd: /c
                kind: claude
                name: s3
                pid: 3
                sessionId: sid-3
                startedAt: 0
                status: waiting
            status: idle
        result:
          - sid-4
      # 'unknown' before is "not waiting", so unknown to waiting still beeps.
      - constructorParams: []
        params:
          - currentSessions:
              - cwd: /a
                kind: claude
                name: s1
                pid: 1
                sessionId: sid-1
                startedAt: 0
                status: waiting
            previousSessions:
              - cwd: /a
                kind: claude
                name: s1
                pid: 1
                sessionId: sid-1
                startedAt: 0
                status: unknown
            status: waiting
        result:
          - sid-1
      # Nothing waiting anymore, however many waited before.
      - constructorParams: []
        params:
          - currentSessions:
              - cwd: /a
                kind: claude
                name: s1
                pid: 1
                sessionId: sid-1
                startedAt: 0
                status: busy
              - cwd: /b
                kind: claude
                name: s2
                pid: 2
                sessionId: sid-2
                startedAt: 0
                status: idle
            previousSessions:
              - cwd: /a
                kind: claude
                name: s1
                pid: 1
                sessionId: sid-1
                startedAt: 0
                status: waiting
              - cwd: /b
                kind: claude
                name: s2
                pid: 2
                sessionId: sid-2
                startedAt: 0
                status: waiting
            status: waiting
        result: []
  resolveStatusTransitionSessionIds:
    terms:
      # The finished-session transition itself: the same session id goes busy to idle.
      - constructorParams: []
        params:
          - currentSessions:
              - cwd: /a
                kind: claude
                name: s1
                pid: 1
                sessionId: sid-1
                startedAt: 0
                status: idle
            fromStatus: busy
            previousSessions:
              - cwd: /a
                kind: claude
                name: s1
                pid: 1
                sessionId: sid-1
                startedAt: 0
                status: busy
            toStatus: idle
        result:
          - sid-1
      # Only busy counts as the finished-from status: waiting becomes idle does not trigger.
      - constructorParams: []
        params:
          - currentSessions:
              - cwd: /a
                kind: claude
                name: s1
                pid: 1
                sessionId: sid-1
                startedAt: 0
                status: idle
            fromStatus: busy
            previousSessions:
              - cwd: /a
                kind: claude
                name: s1
                pid: 1
                sessionId: sid-1
                startedAt: 0
                status: waiting
            toStatus: idle
        result: []
      # Nor does unknown become idle: the session must have been exactly busy before.
      - constructorParams: []
        params:
          - currentSessions:
              - cwd: /a
                kind: claude
                name: s1
                pid: 1
                sessionId: sid-1
                startedAt: 0
                status: idle
            fromStatus: busy
            previousSessions:
              - cwd: /a
                kind: claude
                name: s1
                pid: 1
                sessionId: sid-1
                startedAt: 0
                status: unknown
            toStatus: idle
        result: []
      # A session idle now but absent from the previous snapshot never matches, no
      # matter what the previous snapshot holds for other sessions.
      - constructorParams: []
        params:
          - currentSessions:
              - cwd: /a
                kind: claude
                name: s1
                pid: 1
                sessionId: sid-1
                startedAt: 0
                status: idle
            fromStatus: busy
            previousSessions:
              - cwd: /b
                kind: claude
                name: s2
                pid: 2
                sessionId: sid-2
                startedAt: 0
                status: busy
            toStatus: idle
        result: []
      # An empty previous snapshot is the same story: nobody was busy before, so
      # nobody finished — unlike resolveNewlyStatusSessionIds, where [] means every
      # currently-matching session counts as new.
      - constructorParams: []
        params:
          - currentSessions:
              - cwd: /a
                kind: claude
                name: s1
                pid: 1
                sessionId: sid-1
                startedAt: 0
                status: idle
            fromStatus: busy
            previousSessions: []
            toStatus: idle
        result: []
      # First snapshot (no previous sessions yet): nobody transitioned, even when a
      # session is already idle.
      - constructorParams: []
        params:
          - currentSessions:
              - cwd: /a
                kind: claude
                name: s1
                pid: 1
                sessionId: sid-1
                startedAt: 0
                status: idle
            fromStatus: busy
            previousSessions: !undefined
            toStatus: idle
        result: []
      # Wrong toStatus: idle becomes busy is a start, not a finish.
      - constructorParams: []
        params:
          - currentSessions:
              - cwd: /a
                kind: claude
                name: s1
                pid: 1
                sessionId: sid-1
                startedAt: 0
                status: busy
            fromStatus: busy
            previousSessions:
              - cwd: /a
                kind: claude
                name: s1
                pid: 1
                sessionId: sid-1
                startedAt: 0
                status: idle
            toStatus: idle
        result: []
      # Staying busy is not a transition either.
      - constructorParams: []
        params:
          - currentSessions:
              - cwd: /a
                kind: claude
                name: s1
                pid: 1
                sessionId: sid-1
                startedAt: 0
                status: busy
            fromStatus: busy
            previousSessions:
              - cwd: /a
                kind: claude
                name: s1
                pid: 1
                sessionId: sid-1
                startedAt: 0
                status: busy
            toStatus: idle
        result: []
      # Nor is staying idle.
      - constructorParams: []
        params:
          - currentSessions:
              - cwd: /a
                kind: claude
                name: s1
                pid: 1
                sessionId: sid-1
                startedAt: 0
                status: idle
            fromStatus: busy
            previousSessions:
              - cwd: /a
                kind: claude
                name: s1
                pid: 1
                sessionId: sid-1
                startedAt: 0
                status: idle
            toStatus: idle
        result: []
      # The full matrix: only sid-1 and sid-8 (busy to idle) come back. sid-2 came
      # from waiting, sid-3 from unknown, sid-4 is new (absent before), sid-5 is
      # busy now (was idle), sid-6 stays busy and sid-7 stays idle.
      - constructorParams: []
        params:
          - currentSessions:
              - cwd: /a
                kind: claude
                name: s1
                pid: 1
                sessionId: sid-1
                startedAt: 0
                status: idle
              - cwd: /b
                kind: claude
                name: s2
                pid: 2
                sessionId: sid-2
                startedAt: 0
                status: idle
              - cwd: /c
                kind: claude
                name: s3
                pid: 3
                sessionId: sid-3
                startedAt: 0
                status: idle
              - cwd: /d
                kind: claude
                name: s4
                pid: 4
                sessionId: sid-4
                startedAt: 0
                status: idle
              - cwd: /e
                kind: claude
                name: s5
                pid: 5
                sessionId: sid-5
                startedAt: 0
                status: busy
              - cwd: /f
                kind: claude
                name: s6
                pid: 6
                sessionId: sid-6
                startedAt: 0
                status: busy
              - cwd: /g
                kind: claude
                name: s7
                pid: 7
                sessionId: sid-7
                startedAt: 0
                status: idle
              - cwd: /h
                kind: claude
                name: s8
                pid: 8
                sessionId: sid-8
                startedAt: 0
                status: idle
            fromStatus: busy
            previousSessions:
              - cwd: /a
                kind: claude
                name: s1
                pid: 1
                sessionId: sid-1
                startedAt: 0
                status: busy
              - cwd: /b
                kind: claude
                name: s2
                pid: 2
                sessionId: sid-2
                startedAt: 0
                status: waiting
              - cwd: /c
                kind: claude
                name: s3
                pid: 3
                sessionId: sid-3
                startedAt: 0
                status: unknown
              - cwd: /e
                kind: claude
                name: s5
                pid: 5
                sessionId: sid-5
                startedAt: 0
                status: idle
              - cwd: /f
                kind: claude
                name: s6
                pid: 6
                sessionId: sid-6
                startedAt: 0
                status: busy
              - cwd: /g
                kind: claude
                name: s7
                pid: 7
                sessionId: sid-7
                startedAt: 0
                status: idle
              - cwd: /h
                kind: claude
                name: s8
                pid: 8
                sessionId: sid-8
                startedAt: 0
                status: busy
            toStatus: idle
        result:
          - sid-1
          - sid-8
      # fromStatus/toStatus are parameters, not a hardcoded busy/idle pair: the
      # resumed-work transition idle to busy triggers with the pair swapped.
      - constructorParams: []
        params:
          - currentSessions:
              - cwd: /a
                kind: claude
                name: s1
                pid: 1
                sessionId: sid-1
                startedAt: 0
                status: busy
            fromStatus: idle
            previousSessions:
              - cwd: /a
                kind: claude
                name: s1
                pid: 1
                sessionId: sid-1
                startedAt: 0
                status: idle
            toStatus: busy
        result:
          - sid-1
