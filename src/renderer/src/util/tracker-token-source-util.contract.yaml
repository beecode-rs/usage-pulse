# Contract for trackerTokenSourceUtil.
# Terms cover the per-platform token-source decision rules for the tracker config UI:
# the platform system-token option (label + hint), the effective selected source, and the
# load-time normalization that keeps a stored system source on windows repairable.
subject: trackerTokenSourceUtil
module: ./tracker-token-source-util.js
subjectType: function
methods:
  normalizeConfig:
    terms:
      # A claude tracker stored with the system source on windows is coerced to manual at
      # load, so the dialog displays manual, the manual radio is genuinely selectable, and a
      # save persists manual with the typed token instead of leaving a broken system source.
      - params:
          - config:
              accessToken: ''
              id: tracker-claude
              isAutoRefreshPaused: false
              name: Claude
              providerId: claude
              refreshIntervalSeconds: 300
              tokenSource: SYSTEM
            osPlatform: WINDOWS
        result:
          accessToken: ''
          id: tracker-claude
          isAutoRefreshPaused: false
          name: Claude
          providerId: claude
          refreshIntervalSeconds: 300
          tokenSource: MANUAL
      # On linux the stored system source is kept as-is.
      - params:
          - config:
              accessToken: ''
              id: tracker-claude
              isAutoRefreshPaused: false
              name: Claude
              providerId: claude
              refreshIntervalSeconds: 300
              tokenSource: SYSTEM
            osPlatform: LINUX
        result:
          accessToken: ''
          id: tracker-claude
          isAutoRefreshPaused: false
          name: Claude
          providerId: claude
          refreshIntervalSeconds: 300
          tokenSource: SYSTEM
      # A claude tracker already on manual stays manual on windows.
      - params:
          - config:
              accessToken: ''
              id: tracker-claude
              isAutoRefreshPaused: false
              name: Claude
              providerId: claude
              refreshIntervalSeconds: 300
              tokenSource: MANUAL
            osPlatform: WINDOWS
        result:
          accessToken: ''
          id: tracker-claude
          isAutoRefreshPaused: false
          name: Claude
          providerId: claude
          refreshIntervalSeconds: 300
          tokenSource: MANUAL
      # Non-claude trackers pass through untouched.
      - params:
          - config:
              accessToken: ''
              days: [friday]
              id: tracker-dummy
              isAutoRefreshPaused: false
              name: Dummy
              providerId: dummy
              refreshIntervalSeconds: 300
              times: ['09:00']
            osPlatform: WINDOWS
        result:
          accessToken: ''
          days: [friday]
          id: tracker-dummy
          isAutoRefreshPaused: false
          name: Dummy
          providerId: dummy
          refreshIntervalSeconds: 300
          times: ['09:00']
  resolveSelection:
    terms:
      # Linux offers the logged-in Claude Code system token option and keeps the stored source.
      - params:
          - config:
              accessToken: ''
              id: tracker-claude
              isAutoRefreshPaused: false
              name: Claude
              providerId: claude
              refreshIntervalSeconds: 300
              tokenSource: SYSTEM
            osPlatform: LINUX
        result:
          selectedTokenSource: SYSTEM
          systemTokenOption:
            hint: 'Reads the OAuth token from ~/.claude/.credentials.json on every poll, so it tracks the one Claude Code account logged in on this machine.'
            label: 'Use system token (logged-in Claude Code)'
      # macOS offers the Keychain system token option; no Linux wording appears.
      - params:
          - config:
              accessToken: ''
              id: tracker-claude
              isAutoRefreshPaused: false
              name: Claude
              providerId: claude
              refreshIntervalSeconds: 300
              tokenSource: MANUAL
            osPlatform: MACOS
        result:
          selectedTokenSource: MANUAL
          systemTokenOption:
            hint: 'Reads the OAuth token from the macOS Keychain entry "Claude Code-credentials" on every poll, so it tracks the one Claude Code account logged in on this machine. Not available on Windows yet.'
            label: 'Use system token (macOS Keychain)'
      # Windows offers no system token option, and even a stored system source resolves to
      # manual so the rendered radio never claims system support (post-normalization the
      # config already carries manual; this pins the defensive pre-normalization display).
      - params:
          - config:
              accessToken: ''
              id: tracker-claude
              isAutoRefreshPaused: false
              name: Claude
              providerId: claude
              refreshIntervalSeconds: 300
              tokenSource: SYSTEM
            osPlatform: WINDOWS
        result:
          selectedTokenSource: MANUAL
      # Non-claude providers have no token source section at all: manual, no option.
      - params:
          - config:
              accessToken: ''
              days: [friday]
              id: tracker-dummy
              isAutoRefreshPaused: false
              name: Dummy
              providerId: dummy
              refreshIntervalSeconds: 300
              times: ['09:00']
            osPlatform: LINUX
        result:
          selectedTokenSource: MANUAL
