# Contract for SessionSoundService.
# Terms pin the session sound gain (playSessionSound itself drives the Web Audio
# API and stays untested here). The status-transition resolvers this service
# used to forward to are gone: callers ask sessionStatusTransitionService
# directly, whose own contract covers that logic. resolveSoundGain clamps the
# volume percent to [0, 100] and maps it linearly onto gain [0, 0.4]. Volume 40
# (the app default) divides before multiplying, so the exact double is
# 0.16000000000000003 — the nearest representable neighbor of 0.16.
subject: SessionSoundService
module: ./session-sound-service.js
subjectType: class
constructor:
  # A fresh instance carries no own fields (the AudioContext cache is module-level),
  # so it serializes as an empty object.
  terms:
    - params: []
      result: {}
methods:
  resolveSoundGain:
    terms:
      # Muted volume maps to silence (playSessionSound skips gain <= 0).
      - constructorParams: []
        params:
          - volumePercent: 0
        result: 0
      # A quarter volume: 25 / 100 * 0.4.
      - constructorParams: []
        params:
          - volumePercent: 25
        result: 0.1
      # The app default volume: 40 / 100 * 0.4, which lands one ULP above 0.16
      # because 40 / 100 rounds before the multiply by 0.4.
      - constructorParams: []
        params:
          - volumePercent: 40
        result: 0.16000000000000003
      # Half volume maps to half the max gain.
      - constructorParams: []
        params:
          - volumePercent: 50
        result: 0.2
      # Full volume maps to the max gain.
      - constructorParams: []
        params:
          - volumePercent: 100
        result: 0.4
      # Below the minimum clamps to silence.
      - constructorParams: []
        params:
          - volumePercent: -5
        result: 0
      # Above the maximum clamps to the max gain.
      - constructorParams: []
        params:
          - volumePercent: 120
        result: 0.4
