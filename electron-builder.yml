appId: com.usage-pulse.app
productName: Usage Pulse
directories:
  output: dist
files:
  - out/**
  - build/icons/256x256.png
  - build/icons/512x512.png
  - '!**/node_modules/**'
asar: true
mac:
  category: public.app-category.developer-tools
  identity: null
  artifactName: Usage-Pulse-${version}-${arch}.dmg
  target:
    - target: dmg
      arch:
        - universal
linux:
  category: Utility
  maintainer: milos
  executableName: usage-pulse
  syncDesktopName: true
  target:
    - AppImage
    - deb
appImage:
  artifactName: Usage-Pulse-${version}.${ext}
deb:
  artifactName: usage-pulse_${version}_${arch}.deb
